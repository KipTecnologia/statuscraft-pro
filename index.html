<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StatusCraft Pro — Uptime, SSL &amp; Cron Monitoring Studio</title>
  <style>
    /* =====================================================================
       DESIGN SYSTEM: Warm Alabaster Light + Carbon Graphite Dark (Linear/BetterStack)
       No generic slate-950/blue-600 AI clichés. Crisp hairlines, tabular numbers, SVG icons.
       ===================================================================== */
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-2: #f5f5f4;
      --surface-hover: #f0efed;
      --border: #e7e5e4;
      --border-strong: #d6d3d1;
      --text: #18181b;
      --text-2: #52525b;
      --muted: #71717a;
      --accent: #0f766e;          /* Refined Deep Teal (editorial, non-generic) */
      --accent-hover: #115e59;
      --accent-soft: rgba(15, 118, 110, 0.09);
      --accent-border: rgba(15, 118, 110, 0.24);
      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.10);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.11);
      --red: #dc2626;
      --red-soft: rgba(220, 38, 38, 0.10);
      --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.04), 0 1px 1px rgba(24, 24, 27, 0.02);
      --shadow-md: 0 8px 24px -6px rgba(24, 24, 27, 0.08), 0 2px 6px rgba(24, 24, 27, 0.04);
      --inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      --radius: 11px;
    }

    html.dark {
      --bg: #111113;              /* Warm Carbon Graphite (NOT pitch black / navy) */
      --surface: #18181b;         /* Elevated Zinc Carbon */
      --surface-2: #202024;       /* Subtle inset well */
      --surface-hover: #27272c;
      --border: rgba(255, 255, 255, 0.085);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text: #f4f4f5;
      --text-2: #d4d4d8;
      --muted: #8e8e98;
      --accent: #2dd4bf;          /* Luminous Soft Teal on Graphite */
      --accent-hover: #5eead4;
      --accent-soft: rgba(45, 212, 191, 0.11);
      --accent-border: rgba(45, 212, 191, 0.28);
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.13);
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.13);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 16px 40px -12px rgba(0, 0, 0, 0.65);
      --inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.055);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    button, input, select { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* Layout */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 8px rgba(15, 118, 110, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .brand-title { font-weight: 700; font-size: 13.5px; letter-spacing: -0.02em; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    .nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
    .nav button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: all 0.14s ease;
    }
    .nav button .nav-l { display: flex; align-items: center; gap: 9px; }
    .nav button:hover { background: var(--surface-2); color: var(--text); }
    .nav button.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 600;
    }
    .badge-count {
      background: var(--red-soft);
      color: var(--red);
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-foot {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quota-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 11.5px;
    }
    .quota-row { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 7px; color: var(--text-2); }
    .bar-bg { height: 5px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.25s; }

    /* Main & Topbar */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 11px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.02em; }
    .pill-org {
      font-size: 11px; font-weight: 600;
      padding: 2px 9px; border-radius: 999px;
      background: var(--surface-2); color: var(--text-2);
      border: 1px solid var(--border);
    }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6.5px 11px; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-2);
      box-shadow: var(--shadow-sm), var(--inset-highlight);
      transition: all 0.14s ease;
    }
    .btn:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
    .btn-primary {
      background: var(--accent); color: #ffffff; border-color: transparent;
      box-shadow: 0 1px 2px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.22);
    }
    html.dark .btn-primary { color: #042f2e; font-weight: 700; }
    .btn-primary:hover { background: var(--accent-hover); color: #ffffff; border-color: transparent; }
    html.dark .btn-primary:hover { color: #042f2e; }
    .btn-danger { background: var(--red); color: #fff; border-color: transparent; }
    .btn-danger:hover { opacity: 0.92; background: var(--red); color: #fff; }
    .btn-success { background: var(--emerald); color: #fff; border-color: transparent; }
    .btn-success:hover { opacity: 0.92; background: var(--emerald); color: #fff; }
    .btn-icon { padding: 6.5px 8px; }

    /* Cards & Surfaces */
    .content { padding: 24px; max-width: 1120px; width: 100%; margin: 0 auto; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm), var(--inset-highlight);
    }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi { padding: 16px 18px; }
    .kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi-val { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .card-head h2 { font-size: 13.5px; font-weight: 700; letter-spacing: -0.015em; }
    .card-head p { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* Latency Chart */
    .chart-card { padding: 16px 18px; margin-bottom: 18px; }
    .chart-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .chart-svg { width: 100%; height: 92px; display: block; }

    /* Monitor Rows */
    .monitor-row {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
      transition: background 0.12s;
    }
    .monitor-row:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
    .monitor-row:last-child { border-bottom: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot.UP { background: var(--emerald); box-shadow: 0 0 0 3px var(--emerald-soft); }
    .dot.DEGRADED { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
    .dot.DOWN { background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
    .tag {
      font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
      background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
    }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .bars { display: flex; gap: 3px; margin-top: 10px; }
    .bars span { width: 7px; height: 22px; border-radius: 2.5px; display: inline-block; opacity: 0.92; transition: transform 0.12s, opacity 0.12s; }
    .bars span:hover { transform: scaleY(1.18); opacity: 1; }
    .bars span.UP { background: var(--emerald); }
    .bars span.DEGRADED { background: var(--amber); }
    .bars span.DOWN { background: var(--red); }

    /* Pills */
    .status-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.02em; font-variant-numeric: tabular-nums;
    }
    .status-pill.UP, .status-pill.RESOLVED, .status-pill.PAID, .status-pill.ACTIVE { background: var(--emerald-soft); color: var(--emerald); }
    .status-pill.DOWN, .status-pill.CRITICAL { background: var(--red-soft); color: var(--red); }
    .status-pill.MAJOR, .status-pill.MONITORING, .status-pill.WARN, .status-pill.INVESTIGATING { background: var(--amber-soft); color: var(--amber); }
    .status-pill.INFO, .status-pill.MAINTENANCE, .status-pill.MINOR { background: var(--accent-soft); color: var(--accent); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .plan-card { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .plan-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-sm); }
    .price { font-size: 30px; font-weight: 800; margin: 10px 0; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .price span { font-size: 12px; font-weight: 500; color: var(--muted); }
    .feat-list { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--text-2); margin: 12px 0 20px; }
    .feat-list li { display: flex; align-items: center; gap: 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: 0; }
    .timeline { border-left: 2px solid var(--border); padding-left: 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* Modals & Toast */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(9, 9, 11, 0.6); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border-strong); border-radius: 14px; padding: 20px;
      box-shadow: var(--shadow-md);
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text-2); }
    .field input, .field select {
      width: 100%; padding: 8px 11px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px;
    }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }

    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 50;
      padding: 10px 15px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
      color: #fff; background: #18181b; border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow-md); display: none;
    }
    .toast.show { display: block; }
    .toast.err { background: var(--red); }

    .banner {
      border-radius: 12px; padding: 18px 22px; color: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }
    .banner.ok { background: linear-gradient(135deg, #047857, #059669); }
    .banner.outage { background: linear-gradient(135deg, #b91c1c, #dc2626); }

    .mobile-nav { display: none; overflow-x: auto; gap: 6px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    svg.ic { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    svg.ic-sm { width: 13px; height: 13px; }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="app" id="adminView">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg class="ic" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div>
          <div class="brand-title">StatusCraft Pro</div>
          <div class="brand-sub" id="brandSub"></div>
        </div>
      </div>
      <nav class="nav" id="sidebarNav"></nav>
      <div class="sidebar-foot">
        <div class="quota-box">
          <div class="quota-row">
            <span id="quotaPlanLabel"></span>
            <span class="num" id="quotaCountLabel"></span>
          </div>
          <div class="bar-bg"><div class="bar-fill" id="quotaBar" style="width:20%"></div></div>
        </div>
        <button class="btn" style="justify-content:center" onclick="togglePublicView(true)">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="publicBtnLabel"></span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title" id="pageTitle"></span>
          <span class="pill-org" id="orgPill"></span>
        </div>
        <div class="actions">
          <button class="btn" onclick="toggleLang()" id="langBtn">PT-BR</button>
          <button class="btn btn-icon" onclick="toggleTheme()" id="themeBtn" title="Theme"></button>
          <button class="btn" onclick="pingAllMonitors()">
            <svg class="ic ic-sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span id="pingAllLabel"></span>
          </button>
          <button class="btn btn-primary" onclick="openModal('monitorModal')">
            <svg class="ic ic-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="newMonitorLabel"></span>
          </button>
        </div>
      </header>
      <div class="mobile-nav" id="mobileNav"></div>
      <main class="content" id="tabContent"></main>
    </div>
  </div>

  <!-- PUBLIC STATUS PAGE VIEW -->
  <div id="publicView" style="display:none; min-height:100vh;">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-mark" style="width:28px;height:28px;">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div>
          <div class="topbar-title" id="pubHeaderTitle"></div>
          <div class="mono" style="font-size:11px;color:var(--muted)">status.kiptecnologia.com.br</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="toggleLang()" id="pubLangBtn"></button>
        <button class="btn btn-icon" onclick="toggleTheme()" id="pubThemeBtn"></button>
        <button class="btn" onclick="togglePublicView(false)">← <span id="backAdminLabel"></span></button>
      </div>
    </header>
    <main class="content" style="max-width:860px;" id="publicContent"></main>
  </div>

  <!-- MODAL: NEW MONITOR -->
  <div class="modal-backdrop" id="monitorModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <strong id="mModalTitle"></strong>
        <button class="btn btn-icon" onclick="closeModal('monitorModal')">✕</button>
      </div>
      <form onsubmit="addMonitor(event)">
        <div class="field"><label id="mNameLbl"></label><input id="mName" required /></div>
        <div class="field"><label id="mUrlLbl"></label><input id="mUrl" type="url" required value="https://" /></div>
        <div class="field"><label id="mGroupLbl"></label><input id="mGroup" required /></div>
        <div class="field"><label id="mExpectedLbl"></label><input id="mExpected" type="number" required value="200" /></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="mSubmitBtn"></button>
      </form>
    </div>
  </div>

  <!-- MODAL: NEW INCIDENT -->
  <div class="modal-backdrop" id="incidentModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <strong id="iModalTitle"></strong>
        <button class="btn btn-icon" onclick="closeModal('incidentModal')">✕</button>
      </div>
      <form onsubmit="addIncident(event)">
        <div class="field"><label id="iTitleLbl"></label><input id="iTitle" required /></div>
        <div class="field"><label id="iSeverityLbl"></label><select id="iSeverity"></select></div>
        <div class="field"><label id="iMsgLbl"></label><input id="iMsg" required /></div>
        <button type="submit" class="btn btn-danger" style="width:100%;justify-content:center" id="iSubmitBtn"></button>
      </form>
    </div>
  </div>

  <script>
    const ICONS = {
      overview: `<svg class="ic" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
      heartbeats: `<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
      incidents: `<svg class="ic" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      alerts: `<svg class="ic" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
      team: `<svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,

      clearTimeout(window._tt);
      window._tt = setTimeout(() => el.classList.remove("show"), 3500);

      document.getElementById("pubThemeBtn").innerHTML = icon;

      document.documentElement.classList.toggle("dark");

    function buildLatencySvg(values) {
      const w = 800, h = 88, pad = 6;
      const max = Math.max(...values, 180);
      const min = Math.min(...values, 40);
      const pts = values.map((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const area = `0,${h} ${pts.join(" ")} ${w},${h}`;
      return `
        <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="latGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.26"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <polygon points="${area}" fill="url(#latGrad)"/>
          <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      `;
    }
